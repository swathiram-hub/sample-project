<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width ,initial-scale=1.0">
    <title>Grid  example</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            grid-gap: 20px;
            border: 2px solid rgb(244, 139, 139);

        }
        .block1{
            padding: 20px;
            background-color: brown;
            color: aliceblue;
            text-align: center;
        }
        .block2{
            padding: 20px;
            background-color: rgb(102, 200, 233);
            color: aliceblue;
            text-align: center;
        }
        .block3{
            padding: 20px;
            background-color: rgb(235, 243, 127);
            color: aliceblue;
            text-align: center;
        }
        .block4{
            padding: 20px;
            background-color: rgb(236, 101, 231);
            color: aliceblue;
            text-align: center;
        }

        
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="block1">BLOCK 1</div>
        <div class="block2">BLOCK 2</div>
        <div class="block3">BLOCK 3</div>
        <div class="block4">BLOCK 4</div>
    </div>
</body>
</html>
